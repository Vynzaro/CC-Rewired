<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#15181d"/>

  <!-- Gold outer frame: warm metal, not yellow plastic. -->
  <rect x="1" y="1" width="14" height="12" fill="#8c632b"/>
  <rect x="2" y="1" width="12" height="1" fill="#d2a44b"/>
  <rect x="1" y="2" width="1" height="10" fill="#bd8737"/>
  <rect x="14" y="2" width="1" height="11" fill="#5f4424"/>
  <rect x="2" y="12" width="12" height="1" fill="#6f4c25"/>

  <!-- Recessed display. -->
  <rect x="2" y="2" width="12" height="9" fill="#080b10"/>
  <rect x="3" y="3" width="10" height="7" fill="#0d131b"/>
  <rect x="11" y="3" width="2" height="1" fill="#18212c"/>
  <rect x="12" y="4" width="1" height="2" fill="#141c26"/>

  <!-- Terminal prompt. -->
  <rect x="4" y="4" width="1" height="1" fill="#f1f2ee"/>
  <rect x="5" y="5" width="1" height="1" fill="#f1f2ee"/>
  <rect x="4" y="6" width="1" height="1" fill="#f1f2ee"/>
  <rect x="7" y="7" width="3" height="1" fill="#e6e8e5"/>

  <!-- Lower computer body and status light. -->
  <rect x="1" y="13" width="14" height="2" fill="#272c34"/>
  <rect x="2" y="13" width="9" height="1" fill="#353b44"/>
  <rect x="12" y="13" width="2" height="1" fill="#d2a44b"/>
  <rect x="13" y="13" width="1" height="1" fill="#f0c663"/>
  <rect x="2" y="15" width="12" height="1" fill="#0d1014"/>
</svg>
