name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v6

    - name: 📥 Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: 'temurin'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: ⚒️ Build
      run: ./gradlew assemble

    - name: 📦 Prepare Jars
      run: |
        # Find the main jar and append the git hash onto it.
        mkdir -p jars
        find projects/forge/build/libs projects/fabric/build/libs -maxdepth 1 -type f -name 'cc-rewired-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' -exec bash -c 'cp {} "jars/$(basename {} .jar)-$(git rev-parse --short HEAD).jar"' \;

    - name: 📤 Upload Jar
      uses: actions/upload-artifact@v7
      with:
        name: CC-Rewired
        path: ./jars

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

    - name: 💡 Lint
      run: pipx run pre-commit run --show-diff-on-failure --color=always --all-files

    - name: 🧪 Run tests
      run: ./gradlew check -x runGametest

    - name: 📥 Download assets for game tests
      run: ./gradlew downloadAssets || ./gradlew downloadAssets

    - name: 🧪 Run integration tests
      run: ./gradlew runGametest

    - name: 🧪 Parse test reports
      run: ./tools/parse-reports.py
      if: ${{ failure() }}

  build-core:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows
          uses: windows-latest

        - name: macOS
          uses: macos-latest

    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.uses }}

    steps:
    - name: 📥 Clone repository
      uses: actions/checkout@v6

    - name: 📥 Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: 'temurin'

    - name: 📥 Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: ⚒️ Build
      run: |
        ./gradlew --configure-on-demand :core:assemble

    - name: 🧪 Run tests
      run: |
        ./gradlew --configure-on-demand :core:test

    - name: 🧪 Parse test reports
      run: python3 ./tools/parse-reports.py
      if: ${{ failure() }}
