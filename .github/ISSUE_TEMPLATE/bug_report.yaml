name: Bug report
description: "Report reproducible incorrect behaviour in CC: Rewired"
labels: [bug]
type: bug
body:
- type: markdown
  attributes:
    value: |
      Search existing issues first. CC: Rewired is an alpha project; reports still need complete reproduction details.
- type: dropdown
  id: mc-version
  attributes:
    label: Minecraft version
    options:
    - "1.20.1"
  validations:
    required: true
- type: dropdown
  id: loader
  attributes:
    label: Mod loader
    options:
    - "Forge 47.x"
    - "Fabric (inherited build; limited support)"
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: "CC: Rewired version"
    description: Use the version shown in the Mods screen or the complete development JAR filename.
    placeholder: "0.1.0-alpha.1 or commit SHA"
  validations:
    required: true
- type: textarea
  id: details
  attributes:
    label: Description and reproduction steps
    description: Explain what happened, what you expected and the smallest reliable way to reproduce it.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs and crash reports
    description: Upload the relevant files from the instance's logs or crash-reports directory. Do not paste enormous logs inline.
  validations:
    required: true
- type: textarea
  id: mods
  attributes:
    label: Other installed mods
    description: "Attach a mod list or state that CC: Rewired was tested alone."
  validations:
    required: true
